<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherium: Artistic Cosmic Furnace</title>
    <style>
        :root {
            --bg-deep: #050508;
            --panel-bg: #0e0e16;
            --panel-border: #2a2540;
            --gold: #f6d365;
            --gold-bright: #fda085;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 10%, #151326 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 15px;
            overflow: hidden;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #2a2540; border-radius: 3px; }

        .column {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 18px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        #left-col { flex: 1.1; text-align: center; align-items: center; justify-content: space-between; position: relative; }
        #mid-col { flex: 1.6; }
        #right-col { flex: 1.3; }

        h1, h2, h3 { 
            color: var(--gold); 
            margin-top: 0; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        #quanta-container {
            background: rgba(20, 18, 32, 0.7);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        #quanta-display { 
            font-size: 2.6rem; 
            font-weight: 800; 
            background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0;
        }
        #cps-display { font-size: 1rem; color: var(--text-dim); }

        /* Artistic Custom Orb Button */
        .clicker-btn-container { position: relative; display: flex; justify-content: center; align-items: center; margin: 15px 0; }
        
        .clicker-btn {
            background: radial-gradient(circle at 35% 35%, #4f46e5 0%, #312e81 60%, #0f172a 100%);
            border: 2px solid #818cf8;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s, box-shadow 0.08s;
            letter-spacing: 1px;
        }
        .clicker-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
        }

        .click-float {
            position: absolute;
            color: var(--gold);
            font-size: 1.3rem;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.1); }
        }

        /* Artistic Item Cards */
        .item-card {
            background: rgba(25, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .item-card:hover { 
            border-color: var(--accent); 
            background: rgba(35, 31, 58, 0.8);
        }

        /* Vector Art Icon Container */
        .art-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3730a3 0%, #1e1b4b 100%);
            border: 1px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        /* Custom CSS shapes representing artistic icons */
        .icon-core { width: 16px; height: 16px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 8px var(--gold); }
        .icon-ring { width: 26px; height: 26px; border: 2px solid #c7d2fe; border-radius: 50%; position: absolute; }
        .icon-prism { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 18px solid #38bdf8; }

        button.action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.action-btn:hover { background: var(--accent-hover); }
        button:disabled { 
            background: #1e1b2e !important; 
            color: #4b5563 !important; 
            cursor: not-allowed; 
        }

        .tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab-btn { 
            flex: 1; 
            padding: 9px; 
            background: #12101e; 
            color: var(--text-dim); 
            border: 1px solid var(--panel-border); 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.85rem; 
        }
        .tab-btn.active { 
            background: var(--accent); 
            color: #fff; 
            border-color: var(--accent); 
        }
        .tab-pane { display: none; flex: 1; overflow-y: auto; }
        .tab-pane.active { display: flex; flex-direction: column; }

        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stat-label { color: var(--text-dim); }
        .stat-value { font-weight: 600; color: var(--gold); }
    </style>
</head>
<body>

    <!-- LEFT COLUMN -->
    <div class="column" id="left-col">
        <div id="quanta-container">
            <h2>Aetherium Core</h2>
            <div id="quanta-display">0</div>
            <div id="cps-display">per second: 0.0</div>
        </div>
        
        <div class="clicker-btn-container">
            <button class="clicker-btn" onclick="clickQuanta(event)">HARVEST</button>
        </div>

        <div style="width: 100%;">
            <button class="action-btn" onclick="ascend()" style="background: #e11d48; width: 100%; padding: 12px; font-weight: 700;">Ascend (Legacy Reset)</button>
            <p style="font-size: 0.85rem; color: var(--text-dim); margin: 8px 0 0 0;">Legacy Shards: <span id="chips-display" style="color:var(--gold); font-weight:bold;">0</span> (+<span id="chips-pending">0</span>)</p>
        </div>
    </div>

    <!-- MIDDLE COLUMN -->
    <div class="column" id="mid-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('mid', 'buildings-pane')">Constructs (50)</button>
            <button class="tab-btn" onclick="switchTab('mid', 'minigames-pane')">Flux Engine</button>
        </div>

        <div id="buildings-pane" class="tab-pane active">
            <div id="buildings-container"></div>
        </div>

        <div id="minigames-pane" class="tab-pane">
            <h3>Resonance Matrix</h3>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Stabilize harmonic oscillations to trigger prolonged yield spikes.</p>
            <div style="background: rgba(20, 18, 32, 0.5); border: 1px dashed var(--panel-border); padding: 20px; border-radius: 8px; text-align: center; margin-top: 10px;">
                <div id="mg-status" style="font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: #34d399;">Matrix Stable</div>
                <button class="action-btn" id="mg-btn" onclick="triggerOverclock()">Harmonic Surge</button>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="column" id="right-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('right', 'upgrades-pane')">Upgrades</button>
            <button class="tab-btn" onclick="switchTab('right', 'achievements-pane')">Milestones</button>
            <button class="tab-btn" onclick="switchTab('right', 'stats-pane')">Analytics</button>
        </div>

        <div id="upgrades-pane" class="tab-pane active">
            <div style="margin-bottom: 8px; font-size: 0.85rem; color: var(--text-dim);">Advanced Upgrades:</div>
            <div id="upgrades-container"></div>
        </div>

        <div id="achievements-pane" class="tab-pane">
            <div id="achievements-container"></div>
        </div>

        <div id="stats-pane" class="tab-pane">
            <h3>Operational Analytics</h3>
            <div id="stats-container"></div>
        </div>
    </div>

    <script>
        let game = {
            quanta: 0,
            totalEarned: 0,
            totalClicks: 0,
            timePlayed: 0,
            cps: 0,
            cpc: 1,
            chips: 0,
            buildings: [],
            upgrades: [],
            achievements: []
        };

        // Number formatter handling millions, billions, trillions, up to e+ notation for massive values
        function formatNumber(num) {
            if (num < 1000) return num.toFixed(num % 1 === 0 ? 0 : 1);
            const suffixes = ["", "thousand", "million", "billion", "trillion", "quadrillion", "quintillion", "sextillion", "septillion", "octillion", "nonillion", "decillion"];
            let i = Math.floor(Math.log10(num) / 3);
            if (i >= suffixes.length) {
                return num.toExponential(2).replace('e+', 'E');
            }
            let val = num / Math.pow(10, i * 3);
            return `${val.toFixed(2)} ${suffixes[i]}`;
        }

        const buildingNames = [
            "Aether Probe", "Resonance Spindle", "Plasma Catalyst", "Void Extractor", "Singularity Loom",
            "Chronos Coil", "Stellar Forge", "Quantum Matrix", "Dark Spire", "Nebula Press",
            "Entropy Vault", "Prism Core", "Tachyon Anchor", "Aether Reactor", "Helix Array",
            "Dimension Fold", "Infinity Ring", "Zero-Point Rig", "God Particle Loom", "Omniverse Hub",
            "Genesis Foundry", "Alpha Spire", "Omega Nexus", "Cosmic Weaver", "Eternity Engine",
            "Supermassive Rig", "Quark Compressor", "Event Horizon", "Harmonic Spindle", "Subatomic Press",
            "Photon Crucible", "Flux Matrix", "Aether Well", "Time Loom", "Singularity Press",
            "Void Reactor", "Stellar Anchor", "Quantum Array", "Dark Engine", "Nebula Forge",
            "Entropy Spire", "Prism Core Mk.II", "Tachyon Rig", "Helix Generator", "Dimension Press",
            "Infinity Matrix", "Zero-Point Loom", "God Particle Forge", "Omniverse Array", "The Core Source"
        ];

        // Custom artistic vector graphic elements generator
        function getArtIcon(index) {
            let styles = [
                `<div class="icon-core"></div>`,
                `<div class="icon-ring"></div><div class="icon-core" style="width:8px;height:8px;"></div>`,
                `<div class="icon-prism"></div>`,
                `<div class="icon-ring" style="width:30px;height:14px;border-radius:50%;transform:rotate(45deg);"></div>`
            ];
            return styles[index % styles.length];
        }

        // Initialize 50 Buildings with smooth Cookie Clicker style progression
        for (let i = 0; i < 50; i++) {
            let baseCost = Math.floor(15 * Math.pow(3.8, i / 1.12));
            let baseCps = Math.floor(1 * Math.pow(2.45, i));
            game.buildings.push({
                id: i,
                name: buildingNames[i],
                art: getArtIcon(i),
                cost: baseCost,
                baseCost: baseCost,
                cps: baseCps,
                owned: 0
            });
        }

        // Initialize 5000 Upgrades with balanced values
        for (let i = 0; i < 5000; i++) {
            let targetBuilding = i % 50;
            let tier = Math.floor(i / 50) + 1;
            let rawCost = Math.floor(120 * Math.pow(1.3, i / 22));
            game.upgrades.push({
                id: i,
                name: `${game.buildings[targetBuilding].name} Matrix v${tier}`,
                cost: rawCost,
                target: targetBuilding,
                bought: false,
                unlocked: i < 50
            });
        }

        // Achievements
        for (let i = 0; i < 50; i++) {
            game.achievements.push({
                id: i,
                name: `Resonance Milestone ${i + 1}`,
                desc: `Achieve aggregate harmonic yield threshold #${i + 1}.`,
                target: Math.floor(1000 * Math.pow(4.5, i)),
                unlocked: false
            });
        }

        function clickQuanta(event) {
            let gain = game.cpc * (1 + game.chips * 0.05);
            game.quanta += gain;
            game.totalEarned += gain;
            game.totalClicks++;

            if (event) {
                let floatEl = document.createElement('div');
                floatEl.className = 'click-float';
                floatEl.innerText = `+${formatNumber(gain)}`;
                floatEl.style.left = `${event.clientX - 20}px`;
                floatEl.style.top = `${event.clientY - 20}px`;
                document.body.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 700);
            }

            updateDisplay();
        }

        function buyBuilding(id) {
            let b = game.buildings[id];
            if (game.quanta >= b.cost) {
                game.quanta -= b.cost;
                b.owned++;
                b.cost = Math.floor(b.baseCost * Math.pow(1.15, b.owned));
                
                game.upgrades.forEach(u => {
                    if (u.target === id && b.owned >= (Math.floor(u.id / 50) * 5 + 1)) {
                        u.unlocked = true;
                    }
                });

                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            }
        }

        function buyUpgrade(id) {
            let u = game.upgrades[id];
            if (!u.bought && game.quanta >= u.cost) {
                game.quanta -= u.cost;
                u.bought = true;
                recalculateCPS();
                renderUpgrades();
            }
        }

        function recalculateCPS() {
            let totalCPS = 0;
            game.buildings.forEach(b => {
                let buildingUpgrades = game.upgrades.filter(u => u.target === b.id && u.bought);
                let mult = 1;
                buildingUpgrades.forEach(() => mult *= 1.25); // Slightly better incremental scaling per upgrade purchase
                totalCPS += (b.cps * b.owned * mult);
            });
            game.cps = totalCPS * (1 + game.chips * 0.05);
        }

        function ascend() {
            let pendingChips = Math.floor(Math.sqrt(game.totalEarned / 1e15));
            if (pendingChips > 0) {
                game.chips += pendingChips;
                game.quanta = 0;
                game.totalEarned = 0;
                game.cps = 0;
                game.buildings.forEach(b => { b.owned = 0; b.cost = b.baseCost; });
                game.upgrades.forEach(u => { u.bought = false; });
                alert(`Ascended successfully! Claimed ${pendingChips} Legacy Shards.`);
                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            } else {
                alert("Higher aggregate output required to claim Legacy Shards.");
            }
        }

        let mgActive = false;
        function triggerOverclock() {
            if (!mgActive) {
                mgActive = true;
                document.getElementById('mg-status').innerText = "HARMONIC SURGE ACTIVE!";
                document.getElementById('mg-btn').innerText = "Cooling...";
                game.quanta += Math.max(500, game.cps * 60);
                setTimeout(() => {
                    mgActive = false;
                    document.getElementById('mg-status').innerText = "Matrix Stable";
                    document.getElementById('mg-btn').innerText = "Harmonic Surge";
                }, 15000);
            }
        }

        function switchTab(column, paneId) {
            let col = document.getElementById(column === 'mid' ? 'mid-col' : 'right-col');
            col.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            col.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            event.target.classList.add('active');
            if (paneId === 'stats-pane') renderStats();
        }

        function renderBuildings() {
            let container = document.getElementById('buildings-container');
            container.innerHTML = '';
            game.buildings.forEach(b => {
                container.innerHTML += `
                    <div class="item-card">
                        <div style="display:flex; align-items:center;">
                            <div class="art-icon">${b.art}</div>
                            <div>
                                <strong style="color:var(--gold); font-size:1rem;">${b.name}</strong> [${b.owned}]<br>
                                <small style="color:var(--text-dim);">Cost: ${formatNumber(b.cost)} | +${formatNumber(b.cps)} CPS</small>
                            </div>
                        </div>
                        <button class="action-btn" onclick="buyBuilding(${b.id})">Buy</button>
                    </div>
                `;
            });
        }

        function renderUpgrades() {
            let container = document.getElementById('upgrades-container');
            container.innerHTML = '';
            let count = 0;
            for (let u of game.upgrades) {
                if (u.unlocked && !u.bought) {
                    container.innerHTML += `
                        <div class="item-card">
                            <div>
                                <strong style="font-size:0.95rem;">${u.name}</strong><br>
                                <small style="color:var(--text-dim);">Cost: ${formatNumber(u.cost)}</small>
                            </div>
                            <button class="action-btn" onclick="buyUpgrade(${u.id})">Unlock</button>
                        </div>
                    `;
                    count++;
                    if (count > 40) break;
                }
            }
        }

        function renderAchievements() {
            let container = document.getElementById('achievements-container');
            container.innerHTML = '';
            game.achievements.forEach(a => {
                container.innerHTML += `
                    <div class="item-card" style="opacity: ${a.unlocked ? 1 : 0.35}">
                        <div>
                            <strong>${a.name}</strong><br>
                            <small style="color:var(--text-dim);">${a.desc}</small>
                        </div>
                        <div>${a.unlocked ? '✨' : '🔒'}</div>
                    </div>
                `;
            });
        }

        function renderStats() {
            let container = document.getElementById('stats-container');
            let days = Math.floor(game.timePlayed / 86400);
            let hours = Math.floor((game.timePlayed % 86400) / 3600);
            let minutes = Math.floor((game.timePlayed % 3600) / 60);
            let seconds = Math.floor(game.timePlayed % 60);

            container.innerHTML = `
                <div class="stat-row"><span class="stat-label">Active Time:</span> <span class="stat-value">${days}d ${hours}h ${minutes}m ${seconds}s</span></div>
                <div class="stat-row"><span class="stat-label">Total Harmonic Yield:</span> <span class="stat-value">${formatNumber(game.totalEarned)}</span></div>
                <div class="stat-row"><span class="stat-label">Total Clicks:</span> <span class="stat-value">${game.totalClicks.toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Current CPS:</span> <span class="stat-value">${formatNumber(game.cps)}</span></div>
                <div class="stat-row"><span class="stat-label">Legacy Shards:</span> <span class="stat-value">${game.chips.toLocaleString()}</span></div>
            `;
        }

        // Loop
        setInterval(() => {
            game.quanta += (game.cps / 20);
            game.totalEarned += (game.cps / 20);
            game.timePlayed += 0.05;

            game.achievements.forEach(a => {
                if (!a.unlocked && game.totalEarned >= a.target) {
                    a.unlocked = true;
                    renderAchievements();
                }
            });

            updateDisplay();
        }, 50);

        function updateDisplay() {
            document.getElementById('quanta-display').innerText = formatNumber(game.quanta);
            document.getElementById('cps-display').innerText = `per second: ${formatNumber(game.cps)}`;
            document.getElementById('chips-display').innerText = game.chips;
            document.getElementById('chips-pending').innerText = formatNumber(Math.floor(Math.sqrt(game.totalEarned / 1e15)));
        }

        // Initial Load
        renderBuildings();
        renderUpgrades();
        renderAchievements();
    </script>
</body>
</html>
